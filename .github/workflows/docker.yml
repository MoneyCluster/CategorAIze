name: Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.torchserve'
      - 'src/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.torchserve'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-offline:
    name: Build offline inference image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ml-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          SIZE=$(docker images ml-app:test --format "{{.Size}}" | sed 's/[^0-9.]//g' | head -1)
          echo "Image size: $SIZE"
          # Проверка, что образ не слишком большой (< 2GB для безопасности)
          if (( $(echo "$SIZE > 2000" | bc -l) )); then
            echo "Warning: Image size is larger than 2GB"
          fi

  build-torchserve:
    name: Build TorchServe image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare model-store directory
        id: check_model
        run: |
          mkdir -p model-store
          # Создаём README если его нет, чтобы COPY не падал
          if [ ! -f "model-store/README.md" ]; then
            echo "# Model archives will be placed here" > model-store/README.md
          fi
          # Проверяем наличие .mar файлов
          if [ "$(ls -A model-store/*.mar 2>/dev/null)" ]; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "✓ Model archive (.mar) found"
          else
            echo "model_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Model archive (.mar) not found - build will create empty image"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check_model.outputs.model_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.torchserve
          push: false
          tags: mymodel-serve:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip build message
        if: steps.check_model.outputs.model_exists == 'false'
        run: |
          echo "⚠️ TorchServe build skipped: model archive (.mar file) not found"
          echo "To build TorchServe image, first create model archive using:"
          echo "  ./scripts/create_torchserve_archive.sh"

