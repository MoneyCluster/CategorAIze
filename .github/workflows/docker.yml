name: Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.torchserve'
      - 'src/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.torchserve'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-offline:
    name: Build offline inference image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ml-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          SIZE=$(docker images ml-app:test --format "{{.Size}}" | sed 's/[^0-9.]//g' | head -1)
          echo "Image size: $SIZE"
          # Проверка, что образ не слишком большой (< 2GB для безопасности)
          if (( $(echo "$SIZE > 2000" | bc -l) )); then
            echo "Warning: Image size is larger than 2GB"
          fi

  build-torchserve:
    name: Build TorchServe image
    runs-on: ubuntu-latest
    if: false  # Отключено до создания архива модели
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.torchserve
          push: false
          tags: mymodel-serve:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

