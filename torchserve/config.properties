# Конфигурация TorchServe

# Порты
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# Количество воркеров
workers=1

# Максимальный размер батча
max_batch_size=32
max_batch_delay=100

# Логирование
log_location=/tmp/torchserve.log

# Модель
model_store=/app/model-store

